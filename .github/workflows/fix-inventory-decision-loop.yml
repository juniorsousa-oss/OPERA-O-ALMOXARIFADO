name: Fix inventory decision loop
on:
  push:
    paths:
      - '.github/workflows/fix-inventory-decision-loop.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace inventory decision flow
        run: |
          python - <<'PY'
