name: Ajuste espaco login
on:
  push:
    paths:
      - '.github/patch_login_gap.py'
      - '.github/workflows/patch_login_gap_auto.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .github/patch_login_gap.py
      - name: Validate
        run: python -m py_compile app.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet || git commit -m 'Ajusta espaco entre cabecalho e formulario de login'
          git push
