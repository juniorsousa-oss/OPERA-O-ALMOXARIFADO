name: Fix recount decision flow
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch recount flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          start = s.index("   elif prof=='Gestor' and inv['status']=='AGUARDANDO ANÁLISE':")
          end = s.index("   elif prof=='Gestor' and inv['status']=='FECHADO':", start)
          new = '''   elif prof=='Gestor' and inv['status']=='AGUARDANDO ANÁLISE':
    st.markdown('#### Análise da 1ª contagem')
    for r in inv['rows']:
     if not r['contagens'] or r['status'] in ('FINALIZADO','RECONTAR','AUDITORIA'):
      continue
     q=last(r)
     if abs(diff(r,q))<1e-9:
      r['contagem_final']=q;r['resultado_final']='SISTEMA CONFIRMADO';r['status']='FINALIZADO'
    persist_inv(inv)
    divs=[r for r in inv['rows'] if r['contagens'] and r['status'] not in ('FINALIZADO','RECONTAR','AUDITORIA') and abs(diff(r,last(r)))>1e-9]
    if not divs and not any(r['status'] in ('RECONTAR','AUDITORIA') for r in inv['rows']):
     st.success('Não existem divergências na 1ª contagem. Todos os itens foram confirmados pelo sistema.')
    for r in divs:
     with st.container(border=True):
      q=last(r);a,b,c,d=st.columns(4);a.markdown(f'**{r["codigo"]} / {r["endereco"]}**');b.metric('Sistema',fn(r['qtd_sistema']));c.metric('1ª contagem',fn(q));d.metric('Divergência',signed_brl(divergencia_valor(r,q)));st.caption(f'Divergência de quantidade: {diff(r,q):+,.3f}'.replace(',','X').replace('.',',').replace('X','.')+f' · Classificação: {sev(abs(divergencia_valor(r,q)))} · Comentário: {r["contagens"][-1]["comentario"]}')
      x,y,z=st.columns(3)
      if x.button('RECONTAR ESTE ITEM',key='r1_'+r['id']):
       r['status']='RECONTAR';persist_inv(inv);st.rerun()
      if y.button('AUDITAR ESTE ITEM',key='a1_'+r['id']):
       r['status']='AUDITORIA';persist_inv(inv);st.rerun()
      if z.button('ENCERRAR ESTE ITEM',key='e1_'+r['id']):
       r['contagem_final']=q;r['resultado_final']='ENCERRADO PELO GESTOR';r['status']='FINALIZADO';persist_inv(inv);st.rerun()
    all_divs=[r for r in inv['rows'] if r['contagens'] and r['status']!='FINALIZADO' and abs(diff(r,last(r)))>1e-9]
    pending_decision=[r for r in all_divs if r['status'] not in ('RECONTAR','AUDITORIA')]
    if all_divs and not pending_decision:
     inv['status']='AGUARDANDO EXECUÇÃO';persist_inv(inv);st.success('Todos os itens divergentes receberam uma decisão. As ações foram liberadas para execução.')
    elif all_divs and pending_decision:
     st.info(f'Aguardando decisão do gestor para {len(pending_decision)} item(ns). Nenhuma recontagem ou auditoria será enviada ao operador enquanto houver item sem decisão.')
    x,y,z=st.columns(3)
    if x.button('RECONTAR TODOS OS DIVERGENTES',type='primary',use_container_width=True):
     for r in inv['rows']:
      if r['contagens'] and r['status']!='FINALIZADO' and abs(diff(r,last(r)))>1e-9:r['status']='RECONTAR'
     inv['status']='AGUARDANDO EXECUÇÃO';persist_inv(inv);st.rerun()
    if y.button('AUDITAR TODOS OS DIVERGENTES',use_container_width=True):
     for r in inv['rows']:
      if r['contagens'] and r['status']!='FINALIZADO' and abs(diff(r,last(r)))>1e-9:r['status']='AUDITORIA'
     inv['status']='AGUARDANDO EXECUÇÃO';persist_inv(inv);st.rerun()
    if z.button('ENCERRAR INVENTÁRIO',type='primary',use_container_width=True):close_inv(inv);st.rerun()
   elif prof=='Operador' and inv['status']=='AGUARDANDO EXECUÇÃO':
    st.markdown('#### Execução — itens liberados pelo gestor')
    targets=[r for r in inv['rows'] if r['status'] in ('RECONTAR','AUDITORIA')]
    if not targets:
     inv['status']='AGUARDANDO DECISÃO';persist_inv(inv);st.rerun()
    for r in targets:
     acao='recontagem' if r['status']=='RECONTAR' else 'auditoria'
     with st.container(border=True):
      st.markdown(f'**{r["codigo"]} / {r["endereco"]}**');st.write(r['descricao']);st.caption('Histórico: '+' → '.join(f"{x['etapa']}: {fn(x['quantidade'])}" for x in r['contagens']));q=st.number_input('Nova contagem',0.0,step=.001,format='%.3f',key='qexec_'+r['id']);cm=st.text_input('Comentário (opcional)',key='cmexec_'+r['id'])
      if st.button('Salvar '+acao,key='svexec_'+r['id'],type='primary'):
       etapa='RECONTAGEM' if r['status']=='RECONTAR' else 'AUDITORIA';addcount(r,q,cm,etapa);r['status']='RECONTADA' if r['status']=='RECONTAR' else 'AUDITADA';persist_inv(inv);st.rerun()
    if not any(r['status'] in ('RECONTAR','AUDITORIA') for r in inv['rows']):
     inv['status']='AGUARDANDO DECISÃO';persist_inv(inv);st.rerun()
   elif prof=='Gestor' and inv['status']=='AGUARDANDO DECISÃO':
    st.markdown('#### Avaliação após cada recontagem/auditoria')
    candidates=[r for r in inv['rows'] if r['contagens'] and r['status'] in ('RECONTADA','AUDITADA')]
    if not candidates: st.success('Não existem itens pendentes de decisão.')
    for r in candidates:
     q_atual=last(r);q_anterior=r['contagens'][-2]['quantidade'] if len(r['contagens'])>=2 else None
     with st.container(border=True):
      st.markdown(f'**{r["codigo"]} / {r["endereco"]}**');st.write(f'Sistema: **{fn(r["qtd_sistema"])}** · Contagem anterior: **{fn(q_anterior) if q_anterior is not None else "—"}** · Nova contagem: **{fn(q_atual)}**')
      if q_anterior is not None and abs(q_atual-q_anterior)<1e-9:
       st.success('A nova contagem deste MESMO ITEM é igual à contagem imediatamente anterior: ERRO DE INVENTÁRIO. Nenhuma nova contagem é necessária.');r['contagem_final']=q_atual;r['resultado_final']='ERRO DE INVENTÁRIO';r['status']='FINALIZADO';persist_inv(inv)
      elif abs(q_atual-r['qtd_sistema'])<1e-9:
       st.success('A nova contagem deste MESMO ITEM é igual ao sistema: SISTEMA CONFIRMADO. Nenhuma nova contagem é necessária.');r['contagem_final']=q_atual;r['resultado_final']='SISTEMA CONFIRMADO';r['status']='FINALIZADO';persist_inv(inv)
      else:
       st.warning('A divergência permanece. O gestor deve decidir o próximo passo para ESTE ITEM.');a,b,c=st.columns(3)
       if a.button('RECONTAR ESTE ITEM',key='dr_'+r['id']):r['status']='RECONTAR';persist_inv(inv);st.rerun()
       if b.button('AUDITAR ESTE ITEM',key='da_'+r['id']):r['status']='AUDITORIA';persist_inv(inv);st.rerun()
       if c.button('ENCERRAR ESTE ITEM',key='dc_'+r['id']):r['contagem_final']=q_atual;r['resultado_final']='ENCERRADO PELO GESTOR';r['status']='FINALIZADO';persist_inv(inv);st.rerun()
    x,y,z=st.columns(3)
    if x.button('RECONTAR TODOS OS DIVERGENTES',type='primary',use_container_width=True):
     for r in inv['rows']:
      if r['contagens'] and r['status']!='FINALIZADO' and abs(diff(r,last(r)))>1e-9:r['status']='RECONTAR'
     inv['status']='AGUARDANDO EXECUÇÃO';persist_inv(inv);st.rerun()
    if y.button('AUDITAR TODOS OS DIVERGENTES',use_container_width=True):
     for r in inv['rows']:
      if r['contagens'] and r['status']!='FINALIZADO' and abs(diff(r,last(r)))>1e-9:r['status']='AUDITORIA'
     inv['status']='AGUARDANDO EXECUÇÃO';persist_inv(inv);st.rerun()
    if z.button('ENCERRAR INVENTÁRIO',type='primary',use_container_width=True):close_inv(inv);st.rerun()
   elif prof=='Gestor' and inv['status']=='AGUARDANDO EXECUÇÃO':
    st.info('Há ações de recontagem/auditoria liberadas para execução.')
'''
          p.write_text(s[:start] + new + s[end:], encoding='utf-8')
          PY
      - name: Validate
        run: python -m py_compile app.py
      - name: Commit patch and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py .github/workflows/fix_recount_logic.yml
          git commit -m "fix: gate recount until all decisions are made"
          git rm .github/workflows/fix_recount_logic.yml
          git commit -m "chore: remove one-time recount patch workflow"
          git push
