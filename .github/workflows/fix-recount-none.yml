name: Fix recount None handling
on:
  push:
    paths:
      - '.github/workflows/fix-recount-none.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch recount display
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          old="st.write(f'Sistema: **{fn(r[\"qtd_sistema\"])}** · Anterior: **{fn(q1)}** · Atual: **{fn(q2)}**')"
          new="st.write(f'Sistema: **{fn(r[\"qtd_sistema\"])}** · Anterior: **{fn(q1) if q1 is not None else \"—\"}** · Atual: **{fn(q2)}**')"
          if old not in s:
              raise SystemExit('Target text not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Fix manager recount display for missing previous count'
          git push