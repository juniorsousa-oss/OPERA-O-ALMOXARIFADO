name: Inspect sidebar
on:
  push:
    paths:
      - '.github/inspect_sidebar.py'
      - '.github/workflows/inspect_sidebar.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/inspect_sidebar.py
