name: Fix V5 configuration keys

on:
  push:
    paths:
      - '.github/workflows/fix-config-keys.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add configuration compatibility defaults
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          marker = "config=cfg\n"
          block = """\n# Compatibility defaults: preserve older saved settings while supporting the V5 UI keys.\n_cfg_defaults = {\n    'sidebar_subtitle':'SISTEMA OPERACIONAL DE ESTOQUE',\n    'menu_label':'MENU',\n    'dashboard_label':'DASHBOARD',\n    'inventory_label':'INVENTÁRIO ROTATIVO',\n    'database_label':'BANCO DE DADOS',\n    'register_label':'REGISTRO',\n    'settings_label':'CONFIGURAÇÕES',\n    'new_inventory_text':'NOVO INVENTÁRIO',\n    'address_title':'ENDEREÇOS ELEGÍVEIS',\n    'sidebar_width':250,\n}\nfor _k, _v in _cfg_defaults.items():\n    config.setdefault(_k, _v)\n    cfg.setdefault(_k, _v)\n\n"""
          if marker not in s:
              raise SystemExit('Marker config=cfg not found')
          if '_cfg_defaults = {' not in s:
              s = s.replace(marker, marker + block, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Fix V5 configuration key defaults'
            git push
          fi