name: Fix UI v6
on:
  push:
    paths:
      - '.github/fix_ui_v6.py'
      - '.github/workflows/fix_ui_v6.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/fix_ui_v6.py
      - run: python -m py_compile app.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m 'Refine dashboard charts and sidebar layout'
          git push
