name: Fix V5 app startup

on:
  push:
    paths:
      - '.github/workflows/fix-v5.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix V5 startup errors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("'logo_w':190,'logo_h':70,", "'sidebar_width':250,'logo_w':190,'logo_h':70,", 1)
          s = s.replace("cfg=st.session_state.cfg\n", "cfg=st.session_state.cfg\nconfig=cfg\n", 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Fix V5 startup configuration'
            git push
          fi
