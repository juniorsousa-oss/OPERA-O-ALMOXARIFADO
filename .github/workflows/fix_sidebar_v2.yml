name: Fix sidebar v2
on:
  push:
    paths:
      - '.github/fix_sidebar_v2.py'
      - '.github/workflows/fix_sidebar_v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/fix_sidebar_v2.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m 'Separate report menu and restore sidebar collapse'
          git push
