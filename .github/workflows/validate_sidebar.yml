name: Validate sidebar
on:
  push:
    paths:
      - '.github/validate_sidebar.py'
      - '.github/workflows/validate_sidebar.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/validate_sidebar.py
