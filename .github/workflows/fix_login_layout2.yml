name: Fix login layout 2
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch login layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          start=s.index('def render_login():')
          end=s.index("\nif not st.session_state.auth_user:", start)
          new=r'''def render_login():
    b,n = st.session_state.logo
    login_logo = None
    if b:
        ext=n.lower()
        mime='image/png' if ext.endswith('.png') else 'image/jpeg' if ext.endswith(('.jpg','.jpeg')) else 'image/webp' if ext.endswith('.webp') else 'image/svg+xml'
        login_logo='data:'+mime+';base64,'+base64.b64encode(b).decode()
    st.markdown("""
    <style>
    [data-testid="stHeader"]{background:transparent!important}
    [data-testid="stToolbar"]{visibility:hidden}
    .block-container{padding-top:2rem!important;padding-bottom:2rem!important}
    .login-shell{max-width:440px;margin:8vh auto 0 auto}
    .login-card{background:#101614;border:1px solid #2B3732;border-radius:20px;padding:28px 30px 26px;box-shadow:0 18px 45px rgba(0,0,0,.32)}
    .login-logo{height:76px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;overflow:hidden}
    .login-logo img{max-width:230px;max-height:74px;width:auto;height:auto;object-fit:contain}
    .login-brand{text-align:center;font-size:38px;font-weight:900;letter-spacing:-1.5px;color:#F4F5F2}
    .login-brand span{color:#FFD63B}
    .login-sub{text-align:center;color:#A9B1AC;font-size:10px;letter-spacing:.3px;margin-top:3px}
    .login-title{text-align:center;color:#F4F5F2;font-size:18px;font-weight:800;margin-top:15px}
    [class*="st-key-login_form"] [data-testid="stForm"]{border:0!important;background:transparent!important;padding:0!important;box-shadow:none!important}
    [class*="st-key-login_form"] label{font-size:13px!important;font-weight:700!important;color:#F4F5F2!important}
    [class*="st-key-login_form"] input{height:46px!important;border-radius:10px!important}
    [class*="st-key-login_form"] [data-testid="stFormSubmitButton"]{margin-top:8px!important}
    [class*="st-key-login_form"] [data-testid="stFormSubmitButton"] button{height:46px!important;border-radius:10px!important;font-weight:800!important}
    .login-note{text-align:center;color:#6F7974;font-size:10px;margin-top:14px}
    @media(max-width:640px){.login-shell{max-width:calc(100vw - 32px);margin-top:4vh}.login-card{padding:24px 20px}}
    </style>
    """,unsafe_allow_html=True)
    st.markdown('<div class="login-shell"><div class="login-card">',unsafe_allow_html=True)
    logo_html=(f'<div class="login-logo"><img src="{login_logo}"></div>' if login_logo else '<div class="login-logo"><div class="login-brand">Se<span>tt</span>a</div></div>')
    st.markdown(logo_html+'<div class="login-sub">SISTEMA OPERACIONAL DE ESTOQUE</div><div class="login-title">ACESSO AO SISTEMA</div>',unsafe_allow_html=True)
    with st.form('login_form'):
        email=st.text_input('E-mail',placeholder='seu e-mail')
        password=st.text_input('Senha',type='password',placeholder='Digite sua senha')
        submitted=st.form_submit_button('ENTRAR',type='primary',use_container_width=True,icon=':material/login:')
    st.markdown('<div class="login-note">Acesso autorizado somente para usuários cadastrados.</div></div></div>',unsafe_allow_html=True)
    if submitted:
        if not email or not password:
            st.error('Informe o e-mail e a senha.')
        else:
            data,err=auth_login(email,password)
            if err: st.error(err)
            else:
                st.session_state.auth_user={'email':data.get('email',email),'localId':data.get('localId','')}
                st.session_state.auth_access_token=data.get('idToken','')
                st.session_state.auth_refresh_token=data.get('refreshToken','')
                st.rerun()
'''
          p.write_text(s[:start]+new+s[end:],encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "fix: repair login layout structure"
          git push
