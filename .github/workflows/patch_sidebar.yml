name: Patch sidebar controls
on:
  push:
    paths:
      - '.github/patch_sidebar.py'
      - '.github/workflows/patch_sidebar.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/patch_sidebar.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m 'Fix collapsible sidebar and menu spacing'
          git push
