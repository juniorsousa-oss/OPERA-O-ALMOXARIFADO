name: Fix Firestore initialization order
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reorder initialization
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          start="if 'cfg' not in st.session_state:"
          end="if 'reports' not in st.session_state: st.session_state.reports=load('reports',{}) or {}"
          a=s.find(start)
          b=s.find(end,a)
          if a < 0 or b < 0:
              raise SystemExit('state initialization block not found')
          b += len(end)
          block=s[a:b]
          s=s[:a]+s[b:]
          marker="st.session_state.profile=load_user_profile()"
          m=s.find(marker)
          if m < 0:
              raise SystemExit('profile marker not found')
          s=s[:m]+block+'\n\n'+s[m:]
          compile(s,'app.py','exec')
          p.write_text(s,encoding='utf-8')
          print('syntax ok; state init moved after Firestore helpers')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "fix: initialize persistence helpers before state"
          git push
# trigger
