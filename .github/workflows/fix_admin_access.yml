name: Fix admin access
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          old="""    db = firebase_db()\n    if db is None: return 'Operador'\n    try:\n        bootstrap = str(st.secrets.get('FIREBASE_BOOTSTRAP_ADMIN_EMAIL','')).strip().lower()\n        if bootstrap and email and email == bootstrap:\n            db.collection('usuarios').document(uid).set({'email':email,'nome':email.split('@')[0],'perfil':'ADMIN','ativo':True,'atualizado_em':firestore.SERVER_TIMESTAMP}, merge=True)\n            return 'Admin'\n        ref=db.collection('usuarios').document(uid)\n"""
          new="""    # Bootstrap admin must be recognized even if Firestore is temporarily unavailable.\n    bootstrap = str(st.secrets.get('FIREBASE_BOOTSTRAP_ADMIN_EMAIL','')).strip().lower()\n    if bootstrap and email and email == bootstrap:\n        db = firebase_db()\n        if db is not None:\n            try:\n                db.collection('usuarios').document(uid).set({'email':email,'nome':email.split('@')[0],'perfil':'ADMIN','ativo':True,'atualizado_em':firestore.SERVER_TIMESTAMP}, merge=True)\n            except Exception:\n                pass\n        return 'Admin'\n    db = firebase_db()\n    if db is None: return 'Operador'\n    try:\n        ref=db.collection('usuarios').document(uid)\n"""
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Fix bootstrap admin recognition" || exit 0
          git push