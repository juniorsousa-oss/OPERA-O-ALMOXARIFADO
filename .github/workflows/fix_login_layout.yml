name: Fix login layout
on:
  push:
    paths:
      - .github/workflows/fix_login_layout.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Redesign login screen
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          start = s.index('def render_login():')
          end = s.index("\nif not st.session_state.auth_user:", start)
          new = '''def render_login():
    b,n = st.session_state.logo
    login_logo = None
    if b:
        ext=n.lower()
        mime='image/png' if ext.endswith('.png') else 'image/jpeg' if ext.endswith(('.jpg','.jpeg')) else 'image/webp' if ext.endswith('.webp') else 'image/svg+xml'
        login_logo='data:'+mime+';base64,'+base64.b64encode(b).decode()

    st.markdown(''' + repr('''
    <style>
    [data-testid="stHeader"]{background:transparent!important}
    [data-testid="stToolbar"]{visibility:hidden}
    .block-container{max-width:100%!important;padding-top:0.8rem!important;padding-bottom:1rem!important}
    .login-page{min-height:calc(100vh - 80px);display:flex;align-items:center;justify-content:center;padding:24px 16px 48px}
    .login-card{width:min(430px,94vw);background:#101614;border:1px solid #2B3732;border-radius:20px;box-shadow:0 18px 45px rgba(0,0,0,.32);padding:30px 30px 26px}
    .login-logo{height:82px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;overflow:hidden}
    .login-logo img{max-width:250px;max-height:78px;width:auto;height:auto;object-fit:contain;display:block}
    .login-brand{text-align:center;font-size:38px;font-weight:900;letter-spacing:-1.5px;color:#F4F5F2}
    .login-brand span{color:#FFD63B}
    .login-sub{text-align:center;color:#A9B1AC;font-size:11px;letter-spacing:.25px;margin-top:2px}
    .login-title{text-align:center;color:#F4F5F2;font-size:19px;font-weight:800;margin-top:16px}
    .login-form{margin-top:22px}
    [class*="st-key-login_form"] [data-testid="stForm"]{border:0!important;border-radius:0!important;padding:0!important;background:transparent!important;box-shadow:none!important}
    [class*="st-key-login_form"] label{font-size:13px!important;font-weight:700!important;color:#F4F5F2!important}
    [class*="st-key-login_form"] input{height:46px!important;border-radius:10px!important}
    [class*="st-key-login_form"] [data-testid="stFormSubmitButton"]{margin-top:8px!important}
    [class*="st-key-login_form"] [data-testid="stFormSubmitButton"] button{height:46px!important;border-radius:10px!important;font-weight:800!important}
    .login-footer{text-align:center;color:#6F7974;font-size:10px;margin-top:18px}
    @media (max-width:640px){.login-page{padding:12px 8px 32px}.login-card{padding:24px 20px 22px}.login-logo{height:72px}}
    </style>
    ''') + ''',unsafe_allow_html=True)

    logo_html = (f'<div class="login-logo"><img src="{login_logo}"></div>' if login_logo else '<div class="login-logo"><div class="login-brand">Se<span>tt</span>a</div></div>')
    st.markdown(f'<div class="login-page"><div class="login-card">{logo_html}<div class="login-sub">SISTEMA OPERACIONAL DE ESTOQUE</div><div class="login-title">ACESSO AO SISTEMA</div>', unsafe_allow_html=True)

    with st.container():
        st.markdown('<div class="login-form">', unsafe_allow_html=True)
        with st.form('login_form'):
            email=st.text_input('E-mail',placeholder='seu e-mail')
            password=st.text_input('Senha',type='password',placeholder='Digite sua senha')
            submitted=st.form_submit_button('ENTRAR',type='primary',use_container_width=True,icon=':material/login:')
        st.markdown('</div><div class="login-footer">Acesso autorizado somente para usuários cadastrados.</div></div></div>', unsafe_allow_html=True)

    if submitted:
        if not email or not password:
            st.error('Informe o e-mail e a senha.')
        else:
            data,err=auth_login(email,password)
            if err: st.error(err)
            else:
                st.session_state.auth_user={'email': data.get('email', email), 'localId': data.get('localId','')}
                st.session_state.auth_access_token=data.get('idToken','')
                st.session_state.auth_refresh_token=data.get('refreshToken','')
                st.rerun()
'''
          # Fix the generated Python string quoting by using a clean literal replacement.
          new = new.replace("st.markdown('''" + repr('''\n    <style>\n    [data-testid="stHeader"]{background:transparent!important}\n    [data-testid="stToolbar"]{visibility:hidden}\n    .block-container{max-width:100%!important;padding-top:0.8rem!important;padding-bottom:1rem!important}\n    .login-page{min-height:calc(100vh - 80px);display:flex;align-items:center;justify-content:center;padding:24px 16px 48px}\n    .login-card{width:min(430px,94vw);background:#101614;border:1px solid #2B3732;border-radius:20px;box-shadow:0 18px 45px rgba(0,0,0,.32);padding:30px 30px 26px}\n    .login-logo{height:82px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;overflow:hidden}\n    .login-logo img{max-width:250px;max-height:78px;width:auto;height:auto;object-fit:contain;display:block}\n    .login-brand{text-align:center;font-size:38px;font-weight:900;letter-spacing:-1.5px;color:#F4F5F2}\n    .login-brand span{color:#FFD63B}\n    .login-sub{text-align:center;color:#A9B1AC;font-size:11px;letter-spacing:.25px;margin-top:2px}\n    .login-title{text-align:center;color:#F4F5F2;font-size:19px;font-weight:800;margin-top:16px}\n    .login-form{margin-top:22px}\n    [class*="st-key-login_form"] [data-testid="stForm"]{border:0!important;border-radius:0!important;padding:0!important;background:transparent!important;box-shadow:none!important}\n    [class*="st-key-login_form"] label{font-size:13px!important;font-weight:700!important;color:#F4F5F2!important}\n    [class*="st-key-login_form"] input{height:46px!important;border-radius:10px!important}\n    [class*="st-key-login_form"] [data-testid="stFormSubmitButton"]{margin-top:8px!important}\n    [class*="st-key-login_form"] [data-testid="stFormSubmitButton"] button{height:46px!important;border-radius:10px!important;font-weight:800!important}\n    .login-footer{text-align:center;color:#6F7974;font-size:10px;margin-top:18px}\n    @media (max-width:640px){.login-page{padding:12px 8px 32px}.login-card{padding:24px 20px 22px}.login-logo{height:72px}}\n    </style>\n    ''') + ''',unsafe_allow_html=True)", "st.markdown('''\n    <style>\n    [data-testid=\"stHeader\"]{background:transparent!important}\n    [data-testid=\"stToolbar\"]{visibility:hidden}\n    .block-container{max-width:100%!important;padding-top:0.8rem!important;padding-bottom:1rem!important}\n    .login-page{min-height:calc(100vh - 80px);display:flex;align-items:center;justify-content:center;padding:24px 16px 48px}\n    .login-card{width:min(430px,94vw);background:#101614;border:1px solid #2B3732;border-radius:20px;box-shadow:0 18px 45px rgba(0,0,0,.32);padding:30px 30px 26px}\n    .login-logo{height:82px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;overflow:hidden}\n    .login-logo img{max-width:250px;max-height:78px;width:auto;height:auto;object-fit:contain;display:block}\n    .login-brand{text-align:center;font-size:38px;font-weight:900;letter-spacing:-1.5px;color:#F4F5F2}\n    .login-brand span{color:#FFD63B}\n    .login-sub{text-align:center;color:#A9B1AC;font-size:11px;letter-spacing:.25px;margin-top:2px}\n    .login-title{text-align:center;color:#F4F5F2;font-size:19px;font-weight:800;margin-top:16px}\n    .login-form{margin-top:22px}\n    [class*=\"st-key-login_form\"] [data-testid=\"stForm\"]{border:0!important;border-radius:0!important;padding:0!important;background:transparent!important;box-shadow:none!important}\n    [class*=\"st-key-login_form\"] label{font-size:13px!important;font-weight:700!important;color:#F4F5F2!important}\n    [class*=\"st-key-login_form\"] input{height:46px!important;border-radius:10px!important}\n    [class*=\"st-key-login_form\"] [data-testid=\"stFormSubmitButton\"]{margin-top:8px!important}\n    [class*=\"st-key-login_form\"] [data-testid=\"stFormSubmitButton\"] button{height:46px!important;border-radius:10px!important;font-weight:800!important}\n    .login-footer{text-align:center;color:#6F7974;font-size:10px;margin-top:18px}\n    @media (max-width:640px){.login-page{padding:12px 8px 32px}.login-card{padding:24px 20px 22px}.login-logo{height:72px}}\n    </style>\n    ''',unsafe_allow_html=True)")
          p.write_text(s[:start] + new + s[end:], encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "fix: redesign login screen" || exit 0
          git push
