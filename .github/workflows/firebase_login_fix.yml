name: Fix Firebase login response
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply fix
        run: |
          python .github/firebase_login_fix.py
          python -m py_compile app.py
      - name: Commit fix
        run: |
          if git diff --quiet -- app.py; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'fix: handle Firebase authentication response [skip ci]'
          git push
