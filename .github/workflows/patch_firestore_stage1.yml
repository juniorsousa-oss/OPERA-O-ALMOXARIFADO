name: Patch Firestore persistence stage 1
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.py
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("if 'db' not in st.session_state: st.session_state.db=firestore_load_db() or load('db')", "if 'db' not in st.session_state:\n _fsdb=firestore_load_db(); st.session_state.db=_fsdb if _fsdb is not None else load('db')")
          s = s.replace("if 'pos' not in st.session_state: st.session_state.pos=firestore_load_pos() or load('pos')", "if 'pos' not in st.session_state:\n _fspos=firestore_load_pos(); st.session_state.pos=_fspos if _fspos is not None else load('pos')")
          s = s.replace("if 'eligible' not in st.session_state: st.session_state.eligible=firestore_load_eligible() or load('eligible',[]) or []", "if 'eligible' not in st.session_state:\n _fselig=firestore_load_eligible(); st.session_state.eligible=_fselig if _fselig is not None else (load('eligible',[]) or [])")
          p.write_text(s, encoding='utf-8')
          compile(s, 'app.py', 'exec')
          print('syntax ok')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "fix: handle Firestore DataFrames safely"
          git push
