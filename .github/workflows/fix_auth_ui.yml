name: Apply auth and sidebar UI
on:
  push:
    paths:
      - '.github/fix_auth_ui.py'
      - '.github/workflows/fix_auth_ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/fix_auth_ui.py
      - run: python -m py_compile app.py
      - name: Commit patched app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet || git commit -m 'Redesign sidebar icons and add login'
          git push
